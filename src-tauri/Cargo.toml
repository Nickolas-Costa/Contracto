[package]
name = "contracto"
version = "5.2.0"
description = "Contracto — shell Tauri sobre o sidecar Python (ADR 0029)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde_json = "1"
base64 = "0.22"
# Versões fixadas com >= 2 semanas de publicação (DEPENDENCY_REVIEW.md). Só loopback: sem TLS, sem proxy do sistema (ver `no_proxy` em main.rs).
reqwest = { version = "0.12", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
